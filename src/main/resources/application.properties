app.name=location-explorer
logging.level.org.springframework.web=ERROR
logging.level.name.lorenzani.andrea=INFO

# Foursquare. The credentials come from the environment (FOURSQUARE_CLIENT_ID, FOURSQUARE_CLIENT_SECRET).
foursquare.base-uri=https://api.foursquare.com/v2/
foursquare.explore-path=venues/explore
foursquare.client-id=${FOURSQUARE_CLIENT_ID:}
foursquare.client-secret=${FOURSQUARE_CLIENT_SECRET:}
foursquare.version=20170916
foursquare.page-size=100
foursquare.max-requests-per-search=10
